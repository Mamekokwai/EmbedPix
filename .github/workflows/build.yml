name: Cross-platform build checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle_target: deb
            bundle_directory: deb
            bundle_pattern: '\.deb$'
          - os: macos-latest
            bundle_target: dmg
            bundle_directory: dmg
            bundle_pattern: '\.dmg$'
          - os: windows-latest
            bundle_target: nsis
            bundle_directory: nsis
            bundle_pattern: '-setup\.exe$'

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            pkg-config

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Cache Cargo dependencies and build output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ github.repository }}-${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Verify Rust toolchain
        run: rustup show active-toolchain

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check Tauri CLI availability
        id: tauri
        shell: bash
        run: |
          if npm run tauri -- --version; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tauri CLI is unavailable; bundle smoke will be skipped."
          fi

      - name: Build Tauri bundle smoke
        if: steps.tauri.outputs.available == 'true'
        shell: bash
        env:
          TAURI_BUNDLE_TARGET: ${{ matrix.bundle_target }}
        run: npm run tauri -- build --bundles "$TAURI_BUNDLE_TARGET"

      - name: Verify Tauri bundle artifact
        if: steps.tauri.outputs.available == 'true'
        shell: bash
        env:
          TAURI_BUNDLE_DIRECTORY: ${{ matrix.bundle_directory }}
          TAURI_BUNDLE_PATTERN: ${{ matrix.bundle_pattern }}
        run: >-
          node -e "const fs=require('node:fs'); const path=require('node:path');
          const dir=path.join('src-tauri','target','release','bundle',process.env.TAURI_BUNDLE_DIRECTORY);
          if(!fs.existsSync(dir)) throw new Error('Missing Tauri bundle directory: '+dir);
          const pattern=new RegExp(process.env.TAURI_BUNDLE_PATTERN);
          const files=fs.readdirSync(dir).filter((file)=>pattern.test(file));
          if(files.length===0) throw new Error('No expected Tauri bundle found in '+dir);
          console.log('Verified Tauri bundle:', files.join(', '));"

      - name: Print CI failure diagnostics
        if: failure()
        shell: bash
        run: |
          echo "::error::Cross-platform validation failed on $RUNNER_OS."
          rustup show active-toolchain || true
          npm run tauri -- --version || true
