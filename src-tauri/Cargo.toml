[package]
name = "embedpix"
version = "0.1.2"
description = "Local image format conversion tool"
authors = ["ZeroThrax"]
license = "MIT"
edition = "2021"

[lib]
name = "embedpix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rfd = "0.15.4"
