[package]
name = "engiformat"
version = "0.1.0"
description = "Local image format conversion tool"
authors = ["EngiFormat maintainers"]
license = "MIT"
edition = "2021"

[lib]
name = "engiformat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rfd = "0.15.4"
