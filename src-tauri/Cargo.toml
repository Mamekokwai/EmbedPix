[package]
name = "embedpix"
default-run = "embedpix"
version = "0.5.1"
description = "Local image format conversion tool"
authors = ["ZeroThrax"]
license = "MIT"
edition = "2021"

[lib]
name = "embedpix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
base64 = "0.22"
minisign-verify = "0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "ico"] }
gif = "0.13"
getrandom = "0.3"
color_quant = "1.1"
ctrlc = "3.4"
apng = { version = "0.3.4", features = ["png"] }
webp-animation = { version = "0.10", features = ["static"] }
rfd = "0.15.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
